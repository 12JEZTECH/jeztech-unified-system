<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>JEZTECH Learning recovery</title><style>body{font:16px system-ui;background:#eef3f8;margin:0;padding:24px}main{max-width:420px;margin:8vh auto;background:white;padding:28px;border-radius:16px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:10px 0;font:inherit}button{background:#164e63;color:white;border:0;border-radius:8px}</style><main><h1>Recover your account</h1><form id="f"><label id="label" for="field">Registered email</label><input id="field" type="email" required autocomplete="email"><button>Continue</button></form><p id="status" role="status"></p><a href="/">Return to sign in</a></main><script>const token=location.hash.slice(1),field=document.getElementById('field'),statusEl=document.getElementById('status');if(token){history.replaceState(null,'',location.pathname);field.type='password';field.autocomplete='new-password';field.minLength=12;field.maxLength=128;document.getElementById('label').textContent='New password (at least 12 characters)'}document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch(token?'/api/auth/reset':'/api/auth/recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(token?{token,password:field.value}:{email:field.value})});const d=await r.json();statusEl.textContent=r.ok?d.message:typeof d.detail==='string'?d.detail:'Request failed';if(r.ok)field.value=''}catch{statusEl.textContent='Unable to connect. Try again.'}finally{b.disabled=false}};</script></html>
