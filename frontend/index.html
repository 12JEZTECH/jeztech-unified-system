<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEZTECH Learning</title>
<style>
body{font:15px Arial;margin:0;background:#f3f7fb;color:#172b45}main{max-width:1050px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce5ef;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #cbd8e6;border-radius:8px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#2468b4;color:white;border:0;font-weight:bold;cursor:pointer}.muted{color:#66788d}.hidden{display:none}.brand{font-size:25px;font-weight:900;color:#102b4e}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}.item{border:1px solid #dce5ef;border-radius:10px;padding:12px;margin:9px 0}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{width:auto}.notice{background:#fff3d4;padding:12px;border-radius:9px}
</style><body><main>
<div id="login" class="card" style="max-width:430px;margin:7vh auto"><div class="brand">⚡ JEZTECH Learning</div><p class="muted">Simple access for learners and teachers</p><label>Admission number / username</label><input id="username" placeholder="Learner admission number or staff email"><label>Password / PIN</label><input id="password" type="password"><label>Backend API URL</label><input id="api" value="http://127.0.0.1:8000"><button onclick="login()">Sign in</button><p id="loginMsg" class="muted"></p></div>
<div id="portal" class="hidden"><header class="row"><div><div class="brand">JEZTECH Learning</div><span id="identity" class="muted"></span></div><button onclick="logout()" style="max-width:120px">Sign out</button></header><div class="nav" id="nav"></div>
<section id="dashboard" class="card"><h2>Dashboard</h2><div id="dash"></div></section>
<section id="learning" class="card hidden"><h2>My class lessons</h2><div id="courses"></div></section>
<section id="teaching" class="card hidden"><h2>Teacher workspace</h2><p>Create a class subject, add notes and publish lessons.</p><div class="grid"><input id="courseTitle" placeholder="Course title"><input id="subject" placeholder="Subject"><select id="curriculum"><option>CBC</option><option>8-4-4</option></select><select id="grade"></select></div><button onclick="addCourse()">Create course</button><hr><select id="coursePick"></select><input id="lessonTitle" placeholder="Lesson title"><textarea id="lessonBody" rows="5" placeholder="Explain the lesson, learning activity and examples"></textarea><input id="resource" placeholder="Optional video / resource link"><label><input id="published" type="checkbox" style="width:auto"> Publish lesson</label><button onclick="addLesson()">Save lesson</button><p id="teachMsg"></p></section>
<section id="admin" class="card hidden"><h2>Administrator dashboard</h2><div class="grid"><label>Tuition amount (KES)<input id="tuition" type="number"></label><label>Access duration (days)<input id="duration" type="number"></label></div><button onclick="saveSettings()">Save tuition settings</button><h3>Learner access management</h3><div id="learners"></div><h3>Create teacher account</h3><div class="grid"><input id="teacherName" placeholder="Full name"><input id="teacherEmail" placeholder="Email"><input id="teacherPassword" placeholder="Temporary password"><input id="teacherAdmission" placeholder="Staff username (optional)"></div><button onclick="createTeacher()">Create teacher</button><h3>Recent M-Pesa payments</h3><div id="payments"></div><p id="adminMsg"></p></section></div>
</main><script>
let token='',me=null,api='';
const CBC=['PP1','PP2',...Array.from({length:12},(_,i)=>'Grade '+(i+1))],OLD=[...Array.from({length:8},(_,i)=>'Standard '+(i+1)),...Array.from({length:4},(_,i)=>'Form '+(i+1))];
function fillGrades(){grade.innerHTML=(curriculum.value==='CBC'?CBC:OLD).map(x=>'<option>'+x+'</option>').join('')}curriculum.onchange=fillGrades;fillGrades();
async function req(path,opts={}){let r=await fetch(api+path,{...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})}});let d=await r.json().catch(()=>({detail:'Bad server response'}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function login(){api=document.getElementById('api').value.replace(/\/$/,'');let f=new URLSearchParams({username:username.value,password:password.value});try{let r=await fetch(api+'/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:f});let d=await r.json();if(!r.ok)throw Error(d.detail);token=d.access_token;me=await req('/me');document.getElementById('login').classList.add('hidden');document.getElementById('portal').classList.remove('hidden');identity.textContent=me.name+' · '+me.role;buildNav();await dashboard()}catch(e){loginMsg.textContent=e.message}}
function logout(){location.reload()}
function buildNav(){let tabs=me.role==='student'?['dashboard','learning']:me.role==='teacher'?['dashboard','teaching']:['dashboard','admin'];nav.innerHTML=tabs.map(t=>'<button onclick="show(\''+t+'\')">'+({dashboard:'Dashboard',learning:'My lessons',teaching:'Teaching workspace',admin:'Administration'}[t])+'</button>').join('')}
function show(id){['dashboard','learning','teaching','admin'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='learning')loadCourses();if(id==='teaching')loadTeacherCourses();if(id==='admin')loadAdmin()}
async function dashboard(){if(me.role==='student'){let exp=me.access_expires_at?new Date(me.access_expires_at).toLocaleDateString():'No active tuition';let t=await req('/payments/tuition');dash.innerHTML='<p>Class: <b>'+me.curriculum+' '+me.class_name+'</b></p><p>Access expiry: <b>'+exp+'</b></p><div class="notice">No registration fee. If tuition is due, request an M-Pesa payment prompt below. Lessons unlock after Safaricom confirms payment.</div><h3>Pay tuition</h3><input id="mpesaPhone" placeholder="M-Pesa phone e.g. 07XXXXXXXX"><input id="mpesaAmount" type="number" value="'+t.amount+'" readonly><button onclick="pay()">Pay with M-Pesa</button><p id="payMsg"></p>'}else dash.innerHTML=me.role==='teacher'?'Use Teaching workspace to create lessons for your assigned classes.':'Use Administration to set tuition and manage learners and teachers.'}
async function pay(){try{let d=await req('/payments/mpesa/stk-push',{method:'POST',body:JSON.stringify({phone:mpesaPhone.value,amount:Number(mpesaAmount.value)})});payMsg.textContent=d.message}catch(e){payMsg.textContent=e.message}}
async function loadCourses(){try{let cs=await req('/courses');courses.innerHTML=cs.map(c=>'<div class="item"><b>'+c.subject+' — '+c.title+'</b><p>'+c.curriculum+' '+c.grade_form+'</p><button onclick="lessonsFor(\''+c.id+'\')">Open lessons</button><div id="c'+c.id+'"></div></div>').join('')||'No published courses yet.'}catch(e){courses.textContent=e.message}}
async function lessonsFor(id){try{let ls=await req('/courses/'+id+'/lessons');document.getElementById('c'+id).innerHTML=ls.map(l=>'<div class="item"><b>'+l.title+'</b><p>'+l.body+'</p>'+(l.resource_url?'<a href="'+l.resource_url+'" target="_blank" rel="noopener">Open resource</a>':'')+'</div>').join('')||'No lessons published.'}catch(e){document.getElementById('c'+id).textContent=e.message}}
async function loadTeacherCourses(){try{let cs=await req('/courses');coursePick.innerHTML=cs.map(c=>'<option value="'+c.id+'">'+c.subject+' '+c.grade_form+' '+c.title+'</option>').join('')}catch(e){teachMsg.textContent=e.message}}
async function addCourse(){try{await req('/courses',{method:'POST',body:JSON.stringify({title:courseTitle.value,subject:subject.value,curriculum:curriculum.value,grade_form:grade.value})});teachMsg.textContent='Course created';loadTeacherCourses()}catch(e){teachMsg.textContent=e.message}}
async function addLesson(){try{await req('/courses/'+coursePick.value+'/lessons',{method:'POST',body:JSON.stringify({title:lessonTitle.value,body:lessonBody.value,resource_url:resource.value||null,published:published.checked})});teachMsg.textContent='Lesson saved';lessonTitle.value='';lessonBody.value='';resource.value=''}catch(e){teachMsg.textContent=e.message}}
async function loadAdmin(){try{let s=await req('/admin/settings');tuition.value=s.tuition_amount;duration.value=s.access_days;let us=await req('/admin/users');learners.innerHTML=us.filter(x=>x.role==='student').map(x=>'<div class="item"><b>'+x.name+'</b> · '+x.username+'<br>'+x.curriculum+' '+x.class_name+' · Expires: '+(x.expires_at?new Date(x.expires_at).toLocaleDateString():'Never')+'<div class="grid"><input id="d'+x.id+'" type="number" value="30" placeholder="Add days"><input id="e'+x.id+'" type="date"><button onclick="updateLearner(\''+x.id+'\',false)">Extend days</button><button onclick="setExpiry(\''+x.id+'\')">Set expiry date</button><button onclick="toggleLearner(\''+x.id+'\','+(!x.active)+')">'+(x.active?'Suspend':'Activate')+'</button></div></div>').join('');let ps=await req('/admin/payments');payments.innerHTML=ps.map(p=>'<div class="item">'+p.learner+' · KES '+p.amount+' · '+p.status+' · '+(p.receipt||'Awaiting receipt')+'</div>').join('')||'No payments yet'}catch(e){adminMsg.textContent=e.message}}
async function saveSettings(){try{await req('/admin/settings',{method:'PUT',body:JSON.stringify({tuition_amount:+tuition.value,access_days:+duration.value})});adminMsg.textContent='Settings saved'}catch(e){adminMsg.textContent=e.message}}
async function updateLearner(id){try{await req('/admin/users/'+id+'/access',{method:'POST',body:JSON.stringify({days:+document.getElementById('d'+id).value})});loadAdmin()}catch(e){adminMsg.textContent=e.message}}
async function setExpiry(id){try{let val=document.getElementById('e'+id).value;if(!val)throw Error('Choose a date');await req('/admin/users/'+id+'/access',{method:'POST',body:JSON.stringify({days:0,expires_at:new Date(val+'T23:59:59').toISOString()})});loadAdmin()}catch(e){adminMsg.textContent=e.message}}
async function toggleLearner(id,active){try{await req('/admin/users/'+id+'/access',{method:'POST',body:JSON.stringify({days:0,active})});loadAdmin()}catch(e){adminMsg.textContent=e.message}}
async function createTeacher(){try{let d=await req('/admin/users',{method:'POST',body:JSON.stringify({full_name:teacherName.value,email:teacherEmail.value,password:teacherPassword.value,role:'teacher',admission_no:teacherAdmission.value||null,curriculum:'CBC',class_name:'Teacher'})});adminMsg.textContent='Teacher created. Username: '+d.username}catch(e){adminMsg.textContent=e.message}}
</script></body></html>
